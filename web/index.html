<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIVE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%231b1b1b'/%3E%3Cpath d='M30 118V30H170V170H82' fill='none' stroke='%23e8542b' stroke-width='14'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="brand">
      <svg class="logo" viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="lg" x1="26" y1="30" x2="174" y2="170" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:color-mix(in srgb,var(--accent) 70%,#fff)"/><stop offset=".55" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:color-mix(in srgb,var(--accent) 80%,#000)"/></linearGradient></defs>
        <path d="M30 118V30H170V170H82" fill="none" stroke="url(#lg)" stroke-width="9" stroke-miterlimit="10"/>
        <text x="100" y="128" text-anchor="middle" font-family="Anton" font-size="92" style="fill:var(--accent)">F</text>
      </svg>
      <div class="wordmark">FI<b>VE</b></div>
    </div>
    <div class="counter"><span class="big" id="count">0</span><span class="mono dim" id="countLabel">éléments</span></div>
    <button class="btn go block" id="newFolder" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg>Nouveau dossier</button>
    <button class="btn block second" id="up" type="button"><svg class="ic" viewBox="0 0 24 24"><use href="#i-up"/></svg>Dossier parent</button>
    <nav class="nav" id="places" aria-label="Emplacements"></nav>
    <nav class="nav" id="tags" aria-label="Disques montés"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="top">
      <button class="btn icon only-narrow" id="menu" type="button" aria-label="Menu" title="Menu"><svg class="ic" viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
      <svg class="ic search-ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
      <input class="search" id="search" type="search" placeholder="Chercher un dossier ou un fichier" aria-label="Rechercher" autocomplete="off" spellcheck="false">
      <button class="btn icon" id="hidden" type="button" aria-pressed="false" aria-label="Afficher les fichiers cachés" title="Fichiers cachés ( . )"><svg class="ic" viewBox="0 0 24 24"><use href="#i-eye"/></svg></button>
      <button class="btn icon" id="theme" type="button" aria-label="Changer de thème" title="Thème clair / sombre"><svg class="ic" viewBox="0 0 24 24"><use href="#i-sun"/></svg></button>
      <button class="btn" id="gear" type="button" aria-pressed="false" aria-label="Paramètres" title="Paramètres ( , )"><svg class="ic" viewBox="0 0 24 24"><use href="#i-gear"/></svg><span class="lbl">Paramètres</span></button>
      <div class="user"><span class="avatar" id="avatar">?</span><span class="who"><b id="userName"></b><small class="mono dim" id="userRoot"></small></span></div>
    </header>

    <section class="settings" id="settings" hidden aria-label="Paramètres"></section>

    <div class="content" id="content">
      <section class="folders" aria-label="Dossiers">
        <div class="head">
          <h1 id="title">Accueil</h1>
          <nav class="crumbs mono dim" id="crumbs" aria-label="Chemin"></nav>
        </div>
        <div class="cards" id="cards"></div>
      </section>

      <div class="lower">
        <section class="files" aria-label="Tous les fichiers">
          <div class="files-head">
            <h2 id="filesTitle">Tous les fichiers</h2>
            <div class="pills" id="pills" role="group" aria-label="Filtrer par type"></div>
            <button class="btn" id="paste" type="button" hidden><svg class="ic" viewBox="0 0 24 24"><use href="#i-paste"/></svg><span>Coller</span></button>
            <div class="seg" id="view" role="group" aria-label="Affichage">
              <button type="button" data-v="list" aria-pressed="true" title="Liste" aria-label="Liste"><svg class="ic" viewBox="0 0 24 24"><use href="#i-list"/></svg></button>
              <button type="button" data-v="grid" aria-pressed="false" title="Grille" aria-label="Grille"><svg class="ic" viewBox="0 0 24 24"><use href="#i-grid"/></svg></button>
            </div>
          </div>
          <div class="thead" id="thead" role="row"></div>
          <div class="items" id="items" tabindex="-1"></div>
        </section>

        <section class="work" id="work" aria-label="Espace et aperçu">
          <button class="btn icon work-close" id="close" type="button" aria-label="Fermer l'aperçu" title="Fermer ( Échap )"><svg class="ic" viewBox="0 0 24 24"><use href="#i-x"/></svg></button>
          <div class="work-body" id="workBody"></div>
        </section>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="menu" id="menuPop" role="menu" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-up"><path d="M12 19V5M6 11l6-6 6 6"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></g>
    <g id="i-eye"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></g>
    <g id="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></g>
    <g id="i-menu"><path d="M4 7h16M4 12h16M4 17h16"/></g>
    <g id="i-list"><path d="M4 6h16M4 12h16M4 18h16"/></g>

    <g id="i-more"><circle cx="12" cy="5.5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="18.5" r="1.2"/></g>
    <g id="i-sort"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></g>

    <g id="i-recent"><circle cx="12" cy="12" r="9"/><path d="M8 11.5l4 4 4-4"/></g>
    <g id="i-favorites"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.9l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z"/></g>
    <g id="i-drive"><path d="M3 14h18v6H3zM5 14l2.5-9h9L19 14M7 17h.01M10 17h.01"/></g>
    <g id="i-network"><path d="M4 4h16v10H4zM9 18h6M12 14v4M7 20.5h10"/></g>
    <g id="i-trash"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></g>
    <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-trash2"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></g>
    <g id="i-gear"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
    <g id="i-back"><path d="M19 12H5M11 6l-6 6 6 6"/></g>
    <g id="i-pen"><path d="M4 20l4-1 11-11-3-3L5 16zM14 7l3 3"/></g>
    <g id="i-cut"><circle cx="6" cy="6.5" r="2.5"/><circle cx="6" cy="17.5" r="2.5"/><path d="M8 8l12 9M8 16l12-9"/></g>
    <g id="i-paste"><path d="M9 4h6v3H9zM7 5.5H5V20h14V5.5h-2M9 12h6M9 16h4"/></g>
    <g id="i-pause"><path d="M8 5v14M16 5v14"/></g>
    <g id="i-play"><path d="M7 4.5l12 7.5-12 7.5z"/></g>
    <g id="i-x"><path d="M6 6l12 12M18 6L6 18"/></g>
    <g id="i-down"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></g>
    <g id="i-copy"><path d="M8 8h11v12H8zM5 16V4h11"/></g>
    <g id="i-open"><path d="M3 7h6l2 2h10v10H3z"/></g>
    <g id="i-home"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></g>
    <g id="i-desktop"><path d="M3 5h18v11H3zM8 20h8M12 16v4"/></g>
    <g id="i-docs"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></g>
    <g id="i-downloads"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></g>
    <g id="i-pictures"><path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6"/><circle cx="16" cy="9.5" r="1.4"/></g>
    <g id="i-music"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></g>
    <g id="i-videos"><path d="M3 6h14v12H3zM17 10l4-2.5v9L17 14"/></g>
    <g id="i-folder"><path d="M3 6h6.5l2 2.5H21V19H3z"/></g>
    <g id="i-file"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></g>

    <g id="i-video"><path d="M3 6h14v12H3zM17 10l4-2.5v9L17 14"/></g>
    <g id="i-audio"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></g>
    <g id="i-archive"><path d="M4 4h16v5H4zM5 9v11h14V9M10 13h4"/></g>
    <g id="i-code"><path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/></g>
    <g id="i-text"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h4"/></g>
    <g id="i-link"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g>
  </defs>
</svg>
<script src="/app.js"></script>
<script src="/plus.js"></script>
<script src="/boot.js"></script>
</body>
</html>
